version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - lll
    - misspell
    - revive
    - whitespace
  settings:
    lll:
      line-length: 80
      tab-width: 1
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

# gofumpt/goimports/gofmt always indent with tabs — disabled so
# EditorConfig 2-space indent is not rewritten.
formatters:
  enable: []
